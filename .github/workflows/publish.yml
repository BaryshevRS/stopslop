name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: corepack enable
      - run: corepack prepare pnpm@10.1.0 --activate
      - run: npm install --global npm@11.19.0
      - run: pnpm install --frozen-lockfile
      - name: Verify tag matches package version
        run: >-
          node --input-type=module --eval
          "import pkg from './package.json' with { type: 'json' };
          if (process.env.GITHUB_REF_NAME !== 'v' + pkg.version) process.exit(1)"
      - run: pnpm release:check
      - name: Publish first release with a temporary npm token
        if: env.NPM_TOKEN != ''
        run: npm publish --ignore-scripts --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: Publish through npm trusted publishing
        if: env.NPM_TOKEN == ''
        run: npm publish --ignore-scripts --access public
